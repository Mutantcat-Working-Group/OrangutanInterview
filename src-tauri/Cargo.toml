[package]
name = "orangutan-interview"
version = "1.0.20260929"
description = "面试猿（OrangutanInterview）桌面版"
authors = ["Mutantcat"]
edition = "2021"
[lib]
name = "orangutan_interview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
