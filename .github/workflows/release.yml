name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
            asset-path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            bundles: dmg
            asset-path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: dmg
            asset-path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            asset-path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage
            asset-path: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Create Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'mutantcat-code-signing.pfx'
          $password = 'mutantcat'
          $cert = New-SelfSignedCertificate `
            -Subject 'CN=Mutantcat Working Group, O=Mutantcat Working Group, C=CN' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -KeyExportPolicy Exportable `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10)
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          "PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signtool = $null
          foreach ($kit in (Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory | Sort-Object Name -Descending)) {
            $candidate = Join-Path $kit.FullName 'x64\signtool.exe'
            if (Test-Path $candidate) { $signtool = $candidate; break }
          }
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "SIGNTOOL_PATH=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Tauri embeds the binary into NSIS as-is, so sign the application before bundling.
      - name: Build and sign Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_PATH -or -not $env:SIGNTOOL_PATH) { throw 'code-signing setup did not run' }
          cargo build --release --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
          $app = "src-tauri/target/${{ matrix.target }}/release/orangutan-interview.exe"
          if (-not (Test-Path $app)) { throw "missing $app" }
          & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'Orangutan Interview' "$app"
          echo "signed $app"

      - name: Build desktop bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
      - name: Verify the ad-hoc macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          images=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::no disk image to verify"
            exit 1
          fi
          codesign --verify --verbose=2 "${images[0]}"
          MOUNT="$(mktemp -d)"
          hdiutil attach "${images[0]}" -nobrowse -readonly -mountpoint "${MOUNT}" >/dev/null
          trap 'hdiutil detach "${MOUNT}" >/dev/null || true' EXIT
          if [ ! -L "${MOUNT}/Applications" ]; then
            echo "::error::${images[0]} has no /Applications link"
            exit 1
          fi
          echo "/Applications link -> $(readlink "${MOUNT}/Applications")"
          bundles=("${MOUNT}"/*.app)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::expected one .app bundle in ${images[0]}, found ${#bundles[@]}"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${bundles[0]}"
          if ! codesign -dv "${bundles[0]}" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::the app inside ${images[0]} is not ad-hoc signed"
            exit 1
          fi
          echo "mounted app is ad-hoc signed: ${bundles[0]}"
          hdiutil detach "${MOUNT}" >/dev/null
          trap - EXIT

      - name: Sign and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_PATH -or -not $env:SIGNTOOL_PATH) { throw 'code-signing setup did not run' }
          $app = "src-tauri/target/${{ matrix.target }}/release/orangutan-interview.exe"
          $signature = Get-AuthenticodeSignature $app
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') {
            throw "$app lost its signature during bundling ($($signature.Status))"
          }
          $installers = @(Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'no NSIS installer found' }
          foreach ($installer in $installers) {
            & $env:SIGNTOOL_PATH sign /fd SHA256 /f $env:PFX_PATH /p $env:SIGN_PASSWORD /d 'Orangutan Interview Installer' "$($installer.FullName)"
            $installerSignature = Get-AuthenticodeSignature $installer.FullName
            if (-not $installerSignature.SignerCertificate -or $installerSignature.SignerCertificate.Subject -notlike '*CN=Mutantcat Working Group*') {
              throw "Failed to sign $($installer.FullName) ($($installerSignature.Status))"
            }
            echo "signed $($installer.Name)"
          }

      - name: Rebuild DMG with Applications symlink
        if: runner.os == 'macOS'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DMG_PATH="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n 1)"
          scripts/make-macos-dmg.sh "${VERSION}" "${DMG_PATH}"

      - name: Normalize release asset names
        shell: bash
        run: |
          OLD="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          NEW="OrangutanInterview"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "Normalizing '${OLD}' -> '${NEW}' under ${BUNDLE_DIR}"
          find "${BUNDLE_DIR}" -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 |
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            fixed="${base//$OLD/$NEW}"
            if [ "$fixed" != "$base" ]; then
              mv -f "$f" "$(dirname "$f")/${fixed}"
              echo "Renamed: ${base} -> ${fixed}"
            fi
          done
          echo "Final assets:"
          find "${BUNDLE_DIR}" -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.asset-path }}
          if-no-files-found: error

  web:
    name: Web tarball
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build

      - name: Package web tarball
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="staging/OrangutanInterview-web-${VERSION}"
          mkdir -p "${STAGE}"
          cp -r dist/. "${STAGE}/"
          cp README.md README_EN.md "${STAGE}/"
          mkdir -p web-dist
          tar -czf "web-dist/OrangutanInterview-web-${VERSION}.tar.gz" -C staging "OrangutanInterview-web-${VERSION}"

      - name: Upload web tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-tarball
          path: web-dist/*.tar.gz
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/mutantcat-working-group/orangutan-interview:${{ steps.version.outputs.value }}
            ghcr.io/mutantcat-working-group/orangutan-interview:latest

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Download web tarball
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: web-tarball
          merge-multiple: true

      - name: Make AppImage executable
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -name '*.AppImage' -exec chmod +x {} +

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > ../checksums.txt
          md5sum -- * > ../checksums-md5.txt
          sha1sum -- * > ../checksums-sha1.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* checksums.txt checksums-md5.txt checksums-sha1.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* checksums.txt checksums-md5.txt checksums-sha1.txt --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
