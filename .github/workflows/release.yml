name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macos-universal
            runner: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
            bundles: appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Build desktop bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error

  web:
    name: Web package and Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Resolve version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        run: npm run build

      - name: Package web tarball
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          STAGE="staging/OrangutanInterview-web-${VERSION}"
          mkdir -p "${STAGE}"
          cp -r dist/. "${STAGE}/"
          cp README.md README_EN.md "${STAGE}/"
          mkdir -p web-dist
          tar -czf "web-dist/OrangutanInterview-web-${VERSION}.tar.gz" -C staging "OrangutanInterview-web-${VERSION}"

      - name: Upload web tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-tarball
          path: web-dist/*.tar.gz
          if-no-files-found: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/mutantcat-working-group/orangutan-interview:${{ steps.version.outputs.value }}
            ghcr.io/mutantcat-working-group/orangutan-interview:latest

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten assets
        run: |
          cd release-assets
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 2 -type d -empty -delete

      - name: Make AppImage executable
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -name '*.AppImage' -exec chmod +x {} +

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > ../checksums.txt
          md5sum -- * > ../checksums-md5.txt
          sha1sum -- * > ../checksums-sha1.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* checksums.txt checksums-md5.txt checksums-sha1.txt --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* checksums.txt checksums-md5.txt checksums-sha1.txt --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
          fi
